<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>4-digit repeat counter</title>
<style>
  :root{
    --bg:#f6f7f4; --panel:#ffffff; --ink:#1d2421; --muted:#66706b; --line:#dde2dc;
    --accent:#1f6f5c; --accent-ink:#ffffff; --warn:#b4531a; --warn-bg:#fdf1e7; --hit:#e8f3ee;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141816; --panel:#1c211f; --ink:#e9eeea; --muted:#9aa5a0; --line:#2b332f;
      --accent:#4fb59a; --accent-ink:#0f1513; --warn:#f0a060; --warn-bg:#2a2017; --hit:#1d2e28; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  h1{font-size:1.6rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 24px}
  .num{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  #drop{border:2px dashed var(--line);background:var(--panel);border-radius:10px;padding:32px;text-align:center;cursor:pointer}
  #drop.over,#drop:focus-visible{border-color:var(--accent);outline:none;background:var(--hit)}
  #drop strong{display:block;font-size:1.05rem}
  #drop span{color:var(--muted);font-size:.92rem}
  .bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:20px 0}
  button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 16px;border-radius:8px;cursor:pointer}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  label.exp{color:var(--muted);font-size:.92rem;display:flex;align-items:center;gap:8px;margin-left:auto}
  input[type=number]{width:64px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
  #progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 16px;display:none}
  #progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
  .card.check{border-color:var(--warn);background:var(--warn-bg)}
  .head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:8px}
  .name{font-weight:600;overflow-wrap:anywhere}
  .meta{color:var(--muted);font-size:.88rem;white-space:nowrap}
  .meta b{color:var(--warn)}
  textarea{width:100%;min-height:74px;resize:vertical;font-size:.95rem;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
  .note{font-size:.86rem;color:var(--warn);margin:6px 0 0}
  #results{display:none;margin-top:28px}
  #results h2{font-size:1.2rem;margin:0 0 12px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
  .stat .v{font-size:1.5rem;font-weight:700}
  .stat .l{color:var(--muted);font-size:.85rem}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:.85rem;color:var(--muted);font-weight:600}
  tr:last-child td{border-bottom:0}
  td.imgs{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
  .empty{padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--muted)}
  @media (max-width:560px){ label.exp{margin-left:0} .head{flex-direction:column;gap:2px} }
</style>
</head>
<body>
<main>
  <h1>4-digit repeat counter</h1>
  <p class="sub">Add your screenshots. The numbers are read from every image, you check them, then repeats are counted across all images together.</p>

  <div id="drop" tabindex="0" role="button" aria-label="Choose images">
    <strong>Drop images here or click to choose</strong>
    <span>PNG or JPG, as many as you need (all 36 at once is fine)</span>
  </div>
  <input id="file" type="file" accept="image/*" multiple hidden>

  <div class="bar">
    <button id="count" class="primary" disabled>Count repeats</button>
    <button id="clear" disabled>Clear all</button>
    <label class="exp">Numbers expected per image
      <input id="expected" type="number" min="0" value="20">
    </label>
  </div>

  <div id="progress"><i></i></div>
  <div id="list"></div>

  <section id="results" aria-live="polite">
    <h2>Results</h2>
    <div class="stats" id="stats"></div>
    <div id="table"></div>
    <div class="bar"><button id="csv">Download CSV</button></div>
  </section>
</main>

<script>
const $ = s => document.querySelector(s);
const drop=$('#drop'), fileInput=$('#file'), list=$('#list');
let groups = [];       // {name, numbers:[...], odd:[...], confident, error}
let lastResult = null;

drop.onclick = () => fileInput.click();
drop.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fileInput.click(); } };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => handle([...e.dataTransfer.files]));
fileInput.onchange = () => { handle([...fileInput.files]); fileInput.value=''; };
$('#expected').oninput = render;

async function handle(files){
  files = files.filter(f => f.type.startsWith('image/'))
               .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(!files.length) return;
  const bar=$('#progress'), fill=bar.firstElementChild;
  bar.style.display='block'; fill.style.width='0';
  $('#count').disabled = true;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    drop.querySelector('strong').textContent = `Reading ${i+1} of ${files.length}: ${f.name}`;
    const fd=new FormData(); fd.append('images', f);
    try{
      const r = await fetch('/extract',{method:'POST',body:fd});
      const [g] = await r.json();
      groups.push(g);
    }catch(err){
      groups.push({name:f.name,numbers:[],odd:[],confident:false,error:'Upload failed'});
    }
    fill.style.width = ((i+1)/files.length*100)+'%';
    render();
  }
  drop.querySelector('strong').textContent = 'Drop images here or click to choose';
  setTimeout(()=>bar.style.display='none', 600);
  render();
}

function render(){
  const expected = parseInt($('#expected').value)||0;
  list.innerHTML='';
  groups.forEach((g,i) => {
    const n = g.numbers.length;
    const bad = g.error || !g.confident || (expected && n!==expected) || g.odd.length;
    const card=document.createElement('div');
    card.className='card'+(bad?' check':'');
    const notes=[];
    if(g.error) notes.push(g.error);
    if(expected && n!==expected) notes.push(`Found ${n} numbers, expected ${expected}. Compare with the image.`);
    if(g.odd.length) notes.push(`Ignored non-4-digit reads: ${g.odd.join(', ')}`);
    if(!g.confident && !g.error) notes.push('The reading passes disagreed. Please check these digits.');
    card.innerHTML = `
      <div class="head"><span class="name"></span>
      <span class="meta">${n} numbers${bad?' · <b>check</b>':''}</span></div>
      <textarea class="num" spellcheck="false" aria-label="Numbers from ${g.name.replace(/"/g,'')}"></textarea>
      ${notes.map(t=>`<p class="note"></p>`).join('')}
      <button data-i="${i}" class="rm">Remove</button>`;
    card.querySelector('.name').textContent = g.name;
    card.querySelectorAll('.note').forEach((p,k)=>p.textContent=notes[k]);
    const ta=card.querySelector('textarea');
    ta.value = g.numbers.join(' ');
    ta.oninput = () => { g.numbers = ta.value.match(/\b\d{4}\b/g)||[]; g.confident=true; g.odd=[]; };
    ta.onchange = render;
    card.querySelector('.rm').onclick = () => { groups.splice(i,1); render(); };
    list.appendChild(card);
  });
  $('#count').disabled = !groups.length;
  $('#clear').disabled = !groups.length;
}

$('#clear').onclick = () => { groups=[]; lastResult=null; $('#results').style.display='none'; render(); };

$('#count').onclick = async () => {
  const r = await fetch('/analyze',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({groups:groups.map(g=>({name:g.name,numbers:g.numbers}))})});
  lastResult = await r.json();
  showResults(lastResult);
};

function showResults(d){
  $('#results').style.display='block';
  $('#stats').innerHTML = [
    ['Total numbers',d.total],['Unique numbers',d.unique],
    ['Repeated numbers',d.repeated_count],['Appearing once',d.once]
  ].map(([l,v])=>`<div class="stat"><div class="v num">${v}</div><div class="l">${l}</div></div>`).join('');
  const t=$('#table');
  if(!d.repeated.length){ t.innerHTML='<div class="empty">No repeated numbers found.</div>'; }
  else{
    t.innerHTML = `<table><thead><tr><th>Number</th><th>Times</th><th>Found in</th></tr></thead><tbody>${
      d.repeated.map(x=>`<tr><td class="num">${x.number}</td><td class="num">${x.count}</td>
        <td class="imgs">${x.images.map(s=>s.replace(/</g,'&lt;')).join(', ')}</td></tr>`).join('')}</tbody></table>`;
  }
  $('#results').scrollIntoView({behavior:'smooth',block:'start'});
}

$('#csv').onclick = () => {
  if(!lastResult) return;
  const rows=[['number','times','images'],...lastResult.repeated.map(x=>[x.number,x.count,`"${x.images.join('; ')}"`])];
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')],{type:'text/csv'}));
  a.download='repeated_numbers.csv'; a.click();
};
</script>
</body>
</html>
